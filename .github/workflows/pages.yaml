name: Build historical R help

on:
  workflow_dispatch:
    inputs:
      image:
        description: Single Evercran image to test; blank builds the full site
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            build-help.sh
            build-indexes.R
            guest-build-help.sh
            guest-render-help.R
            navigation.js
          sparse-checkout-cone-mode: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - run: ./build-help.sh "$IMAGE"
        env:
          IMAGE: ${{ inputs.image }}

      - uses: actions/configure-pages@v5
        if: inputs.image == ''
      - uses: actions/upload-pages-artifact@v4
        if: inputs.image == ''
        with:
          path: site
      - id: deployment
        if: inputs.image == ''
        uses: actions/deploy-pages@v4
