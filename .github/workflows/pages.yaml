name: Build historical R help

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            build-help.sh
            build-indexes.R
            evercran-images.txt
            guest-build-help.sh
            guest-render-help.R
          sparse-checkout-cone-mode: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - run: ./build-help.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
